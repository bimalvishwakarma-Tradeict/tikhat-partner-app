# Tikhat Partner — Nginx site configuration
# Domain: tikhatpartner.online
# Frontend: /var/www/tikhat/
# API proxy: http://127.0.0.1:5000
#
# Task 27.4 — Cloudflare real IP restoration:
# Visitors hit Cloudflare → Cloudflare connects to origin.
# Without the block below, $remote_addr is a Cloudflare edge IP (e.g. 103.x).
# With CF-Connecting-IP + set_real_ip_from, $remote_addr becomes the real client IP,
# which is then forwarded to Node as X-Real-IP / X-Forwarded-For for rate limiting.

# ---------------------------------------------------------------------------
# Cloudflare IP ranges (update periodically from https://www.cloudflare.com/ips/)
# ---------------------------------------------------------------------------
# IPv4
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;

# IPv6
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;

real_ip_header CF-Connecting-IP;
real_ip_recursive on;

# HTTP → HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name tikhatpartner.online www.tikhatpartner.online;

    # Optional: lock origin to Cloudflare only (enable after orange-cloud proxy is on).
    # See CLOUDFLARE_SETUP.md for the matching UFW rules.
    # include /etc/nginx/snippets/cloudflare-only.conf;

    # ACME / Certbot challenge (optional — prefer Cloudflare Origin Certificate)
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/tikhat;
        allow all;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS application
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name tikhatpartner.online www.tikhatpartner.online;

    # Optional: lock origin to Cloudflare only
    # include /etc/nginx/snippets/cloudflare-only.conf;

    # Cloudflare Origin Certificate (Full Strict) or Let's Encrypt
    ssl_certificate     /etc/ssl/certs/tikhatpartner.pem;
    ssl_certificate_key /etc/ssl/private/tikhatpartner.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip compression
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_vary on;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml
        application/xml+rss
        application/xhtml+xml
        image/svg+xml
        font/woff2;

    client_max_body_size 5m;

    root /var/www/tikhat;
    index index.html;

    # Static frontend (Expo web export)
    location / {
        try_files $uri $uri/ /index.html;

        # Cache hashed static assets
        location ~* \.(?:js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
            expires 7d;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }
    }

    # Backend API → PM2 cluster on port 5000
    # $remote_addr is the REAL visitor IP after Cloudflare real_ip_* above.
    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_set_header Connection "";

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Health check convenience (same backend route)
    location = /health {
        proxy_pass http://127.0.0.1:5000/api/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
